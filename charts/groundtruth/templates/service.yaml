apiVersion: v1
kind: Service
metadata:
  name: {{ include "groundtruth.fullname" . }}
  labels:
    {{- include "groundtruth.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "groundtruth.selectorLabels" . | nindent 4 }}
