apiVersion: v1
kind: Pod
metadata:
  name: {{ include "groundtruth.fullname" . }}-test-connection
  labels:
    {{- include "groundtruth.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: health
      image: busybox:1.37
      command:
        - wget
        - -qO-
        - http://{{ include "groundtruth.fullname" . }}:{{ .Values.service.port }}/health
