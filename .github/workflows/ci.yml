name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --locked fails the build if uv.lock is stale vs pyproject.toml; the
      # subsequent --frozen runs install/execute strictly from the lockfile
      # with no dependency resolution.
      - run: uv sync --all-extras --locked
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src/
      - run: uv run --frozen pytest
