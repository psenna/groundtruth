name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # --locked fails the build if uv.lock is stale vs pyproject.toml; the
      # subsequent --frozen runs install/execute strictly from the lockfile
      # with no dependency resolution.
      - run: uv sync --all-extras --locked
      - run: uv run --frozen ruff check .
      - run: uv run --frozen ruff format --check .
      - run: uv run --frozen mypy src/
      - run: uv run --frozen pytest

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Build only (no push) so a Dockerfile regression fails a PR instead of a
      # release. The release workflow is the only thing that publishes.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: groundtruth:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke-test the image
        run: |
          docker run --rm groundtruth:ci python -c "import groundtruth; print(groundtruth.__version__)"
          docker run --rm groundtruth:ci python -c "from groundtruth.main import build_app"

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4
      - run: helm lint charts/groundtruth
      - name: Render and schema-check manifests
        run: |
          helm template rel charts/groundtruth --set secret.data.GT_API_KEY=x \
            --set ingress.enabled=true > /tmp/rendered.yaml
          curl -sSLo /tmp/kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar -xzf /tmp/kubeconform.tar.gz -C /tmp
          /tmp/kubeconform -strict -summary -kubernetes-version 1.29.0 /tmp/rendered.yaml
