[project]
name = "groundtruth"
version = "0.1.0"
description = "Ingest unstructured text into an Obsidian vault; answer only from what it contains, or refuse."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# mcp 2.x renamed FastMCP -> MCPServer and changed the transport API; §10.2 and
# the MCP issues target the 1.x FastMCP surface. Pin to 1.x until a deliberate port.
mcp = ["mcp>=1.9,<2"]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "hypothesis>=6.112",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    # Build backend, pinned into the lock so an offline `uv sync` against the
    # DependaProxy wheelhouse can build this project (see scripts/fetch-deps.py).
    "hatchling>=1.25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Pin resolution to a fixed instant so `uv.lock` is reproducible AND every locked
# version is old enough to pass DependaProxy's "published >= 7 days ago" gate,
# which is how `scripts/fetch-deps.py` fills the local wheelhouse. Bump this date
# deliberately (and only past a 7-day-old release) when picking up new versions.
exclude-newer = "2026-08-15T00:00:00Z"

[tool.hatch.build.targets.wheel]
packages = ["src/groundtruth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "integration: touches the filesystem, git, or a real service",
    "eval_live: golden-eval case run against a real LLM (opt-in, needs GT_EVAL_MODEL_BASE_URL)",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "PTH", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true
