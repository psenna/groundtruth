<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}groundtruth{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" crossorigin="anonymous"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
    nav a { margin-right: 1rem; }
    textarea { width: 100%; min-height: 8rem; }
    .refusal { border-left: 4px solid #b8860b; background: #fff8e1; padding: .75rem 1rem; }
    .refusal h3 { margin-top: 0; color: #7a5c00; }
    .error { border-left: 4px solid #c62828; background: #ffebee; padding: .75rem 1rem; }
    .answer { border-left: 4px solid #2e7d32; padding: .75rem 1rem; }
    .job-failed { color: #c62828; }
    .citations a { display: inline-block; margin-right: .5rem; }
  </style>
</head>
<body>
  <nav><a href="/">Query</a><a href="/ingest">Ingest</a><a href="/browse">Browse</a></nav>
  {% block content %}{% endblock %}
</body>
</html>
